  <style>
    .portfolio-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      padding: 0 15px;
    }
    .big-center img {
      width: 100%;
      max-width: 1000px;
      padding: 1%;
      border-radius: 10px;
      display: block;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    .big-center img:hover {
      transform: scale(1.05);
    }
    .row-three {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      width: 100%;
      flex-wrap: wrap;
    }
    .row-three img {
      width: 30%;
      min-width: 180px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    .row-three img:hover {
      transform: scale(1.05);
    }
    .small-center button {
      margin-top: 20px;
    }
    @media (max-width: 768px) {
      .big-center img {
        width: 95%;
      }
      .row-three img {
        width: 45%;
      }
    }
    @media (max-width: 480px) {
      .row-three {
        flex-direction: column;
        gap: 15px;
        align-items: center;
      }
      .row-three img {
        width: 80%;
      }
    }

    /* เอฟเฟ็กต์ Fade ของภาพสุ่ม */
    #random-img {
      opacity: 1;
      transition: opacity 0.8s ease-in-out;
      max-width: 1000px;
      width: 90%;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
  </style>
</head>

  <!-- Random Image Script -->
  <script>
    const bgImages = [
      'img/random/1.png','img/random/3.png','img/random/4.png',
      'img/random/5.png','img/random/6.png','img/random/7.png',
      'img/random/8.png','img/random/9.png','img/random/10.png',
      'img/random/11.png','img/random/12.png','img/random/13.png'
    ];

    function changeRandomImage() {
      const imgElement = document.getElementById('random-img');
      imgElement.style.opacity = 0;
      setTimeout(() => {
        const randomIndex = Math.floor(Math.random() * bgImages.length);
        imgElement.src = bgImages[randomIndex];
        imgElement.onload = () => {
          imgElement.style.opacity = 1;
        };
      }, 400);
    }

    changeRandomImage();
    setInterval(changeRandomImage, 3000);
  </script>
